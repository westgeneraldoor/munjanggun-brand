name: Validate Brand Source

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate central brand docs
        run: npm run validate

      - name: Validate asset manifests
        run: npm run validate:manifests

      - name: Report asset semantic coverage
        run: npm run report:assets

      - name: Check whitespace errors
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || printf HEAD)"
          fi
          git diff --check "$base" "${{ github.sha }}"
