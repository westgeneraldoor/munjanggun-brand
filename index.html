<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./BRAND_GUIDELINE.html">
  <title>문장군 브랜드 가이드라인으로 이동</title>
  <style>
    :root {
      --mg-ivory: #FBF7F1;
      --mg-text: #2E241C;
      --mg-clay: #9C4E2C;
      --mg-surface: #FFFFFF;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--mg-ivory);
      color: var(--mg-text);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(520px, calc(100% - 40px));
      padding: 32px;
      border: 1px solid rgba(46, 36, 28, .12);
      border-radius: 20px;
      background: var(--mg-surface);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.35;
      font-weight: 800;
    }

    p {
      margin: 0 0 22px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--mg-clay);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>문장군 브랜드 가이드라인</h1>
    <p>잠시 후 BRAND_GUIDELINE.html (v4.0 동네 온기) 페이지로 이동합니다.</p>
    <a href="./BRAND_GUIDELINE.html">바로 보기</a>
  </main>
</body>
</html>
